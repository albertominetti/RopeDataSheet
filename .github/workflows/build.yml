name: Compile and test

on:
  push:
    branches:
      - "**"
      - "!release/prod"
  pull_request:
    branches:
      - "**"
      - "!release/prod"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install


